jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Engine regression
        run: npm run test:engine
      - name: Domain contract tests
        run: npm run test:domain
      - name: World bootstrap and randomized population contracts
        run: npm run test:world-bootstrap
      - name: Replay-backed world command/query adapter contracts
        run: npm run test:world-adapter
      - name: World application initialization and resumable population contracts
        run: npm run test:world-initialize
      - name: Deterministic world simulation scheduler contracts
        run: npm run test:world-scheduler
      - name: Player command authorization gate contracts
        run: npm run test:world-authorization-gate
      - name: Authenticated player boundary isolation contracts
        run: npm run test:world-player-boundary
      - name: Local development owner identity contracts
        run: npm run test:local-owner-identity --if-present
      - name: Owner to player Person principal binding contracts
        run: npm run test:owner-person-principal
      - name: Owner player boundary composition contracts
        run: npm run test:owner-player-boundary-composition
      - name: Owner player runtime startup contracts
        run: npm run test:owner-player-runtime-startup
      - name: World event registry and aggregate reducer contracts
        run: npm run test:world-event
      - name: Replay-backed world projector contracts
        run: npm run test:world-projector
      - name: Identity and authorization contract tests
        run: npm run test:domain:identity
      - name: Authorization principal death gate contracts
        run: npm run test:domain:authorization-death
      - name: Relations and organizations contract tests
        run: npm run test:domain:relations
      - name: Cognition and communications contract tests
        run: npm run test:domain:cognition
      - name: Planning and economy contract tests
        run: npm run test:domain:planning-economy
      - name: Debt party death continuity contracts
        run: npm run test:domain:debt-death
      - name: Debt death inventory completeness contracts
        run: npm run test:domain:debt-death-inventory
      - name: Estate asset inventory contracts
        run: npm run test:domain:estate-inventory
      - name: Membership death continuity contracts
        run: npm run test:domain:membership-death
      - name: Relation death continuity contracts
        run: npm run test:domain:relation-death
      - name: Goal death continuity contracts
        run: npm run test:domain:goal-death
      - name: Goal status history contracts
        run: npm run test:domain:goal-status-history
      - name: Life history and body/mind hook contracts
        run: npm run test:domain:life
      - name: Calendar age contract tests
        run: npm run test:domain:age
      - name: Asset inheritance contract tests
        run: npm run test:domain:inheritance
      - name: Body and mind state fact contracts
        run: npm run test:domain:life-state
      - name: Life stage fact contracts
        run: npm run test:domain:life-stage
      - name: Unified life time boundary contracts
        run: npm run test:domain:life-time
      - name: Death settlement reference contracts
        run: npm run test:domain:death-settlement
      - name: Death office appointment handoff contracts
        run: npm run test:domain:death-office
      - name: Death office inventory completeness contracts
        run: npm run test:domain:death-office-inventory
      - name: Membership death inventory completeness contracts
        run: npm run test:domain:membership-death-inventory
      - name: Relation death inventory completeness contracts
        run: npm run test:domain:relation-death-inventory
      - name: Goal death inventory completeness contracts
        run: npm run test:domain:goal-death-inventory
      - name: Death settlement evidence envelope contracts
        run: npm run test:domain:death-evidence-envelope
      - name: Death settlement coordinator contracts
        run: npm run test:domain:death-coordinator
      - name: Event ledger and command idempotency contracts
        run: npm run test:domain:event-ledger
      - name: Event schema registry contracts
        run: npm run test:domain:event-registry
      - name: AI candidate validation and receipt contracts
        run: npm run test:domain:ai-candidate
      - name: Event replay and read-only projection contracts
        run: npm run test:domain:event-replay
      - name: World snapshot and checkpoint contracts
        run: npm run test:domain:world-snapshot
      - name: Full save package and event range contracts
        run: npm run test:domain:save-package
      - name: Incremental save package chain contracts
        run: npm run test:domain:incremental-save-package
      - name: Preview runtime event catalog and projection contracts
        run: npm run test:domain:preview-runtime-projection
      - name: Runtime command orchestration contracts
        run: npm run test:domain:runtime-orchestrator
      - name: Runtime AI candidate receipt and fact contracts
        run: npm run test:domain:runtime-ai-candidate
      - name: Generated event game-hook integration contracts
        run: npm run test:domain:generated-event-hook
      - name: IndexedDB save repository adapter contracts
        run: npm run test:domain:indexeddb-save-repository
      - name: Runtime SavePackage orchestration contracts
        run: npm run test:domain:runtime-save-orchestrator
      - name: Runtime startup restore contracts
        run: npm run test:domain:runtime-restore-orchestrator
      - name: Verified portable save export contracts
        run: npm run test:domain:portable-save-export
      - name: Strict JSON import parser contracts
        run: npm run test:domain:strict-json
      - name: Review index integrity
        run: npm run check:docs
      - name: Patch whitespace integrity
        working-directory: .
        run: git diff --check d6f08f84525e319981684071cf6f6c6cbc64feea...HEAD
      - name: Production build
        run: npm run build
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 5199 > /tmp/guanyuan-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5199/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/guanyuan-vite.log
          exit 1
      - name: Playwright smoke and archive regression
        env:
          TEMP: /tmp
        run: npm run smoke
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guanyuan-g1-7-smoke
          path: /tmp/guanyuan-smoke/
          if-no-files-found: ignore
